name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            runtime: linux-x64
            archive: tar.gz
            output: PseudoCode-linux-x64
          - name: Windows
            os: windows-latest
            runtime: win-x64
            archive: zip
            output: PseudoCode-win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Get version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag }}"
          version="${tag#v}"

          if [[ "$version" =~ ^beta([0-9]+)\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0-beta.1"
          elif [[ "$version" =~ ^beta([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-beta.1"
          elif [[ "$version" =~ ^alpha([0-9]+)\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0-alpha.1"
          elif [[ "$version" =~ ^alpha([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-alpha.1"
          elif [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$tag'. Use v1.0.0, 1.0.0-beta.1, beta1.0, or alpha1.0."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore PseudoCode.sln

      - name: Publish
        run: >
          dotnet publish src/PseudoCode.App/PseudoCode.App.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.output }}

      - name: Package Linux
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.output }}-${{ steps.version.outputs.tag }}.tar.gz -C publish ${{ matrix.output }}

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish/${{ matrix.output }}/*" -DestinationPath "dist/${{ matrix.output }}-${{ steps.version.outputs.tag }}.zip" -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create git tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find dist -type f | sort)

          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PseudoCode $TAG" \
            --generate-notes
