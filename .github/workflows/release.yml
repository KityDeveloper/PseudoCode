name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            runtime: linux-x64
            archive: tar.gz
            output: PseudoCode-linux-x64
          - name: Windows
            os: windows-latest
            runtime: win-x64
            archive: zip
            output: PseudoCode-win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Get version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag }}"
          version="${tag#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$tag'. Use v1.0.0, v1.0.0-beta.1, or v1.0.0-alpha.1."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore PseudoCode.sln

      - name: Install Linux packaging tools
        if: matrix.runtime == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Publish
        run: >
          dotnet publish src/PseudoCode.App/PseudoCode.App.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.output }}

      - name: Package Linux
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.output }}-${{ steps.version.outputs.tag }}.tar.gz -C publish ${{ matrix.output }}

      - name: Package Debian and Fedora
        if: matrix.runtime == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          package_name="pseudocode"
          display_name="PseudoCode"
          package_root="package-root"
          deb_root="deb-root"
          app_dir="$package_root/opt/pseudocode"

          rm -rf "$package_root" "$deb_root" rpmbuild
          mkdir -p "$app_dir" "$package_root/usr/bin" "$package_root/usr/share/applications"
          cp -R publish/${{ matrix.output }}/. "$app_dir/"
          cp packaging/linux/pseudocode.desktop "$package_root/usr/share/applications/pseudocode.desktop"
          cat > "$package_root/usr/bin/pseudocode" <<'EOF'
          #!/usr/bin/env sh
          exec /opt/pseudocode/PseudoCode.App "$@"
          EOF
          chmod +x "$package_root/usr/bin/pseudocode" "$app_dir/PseudoCode.App"

          cp -a "$package_root" "$deb_root"
          mkdir -p "$deb_root/DEBIAN"
          cat > "$deb_root/DEBIAN/control" <<EOF
          Package: $package_name
          Version: $version
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Kity Dev <kitydeveloper@gmail.com>
          Description: $display_name editor educativo de pseudocodigo
           Editor de pseudocodigo en espanol hecho con .NET y Avalonia.
          EOF
          dpkg-deb --build "$deb_root" "dist/${package_name}_${version}_amd64.deb"

          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          tar -czf "rpmbuild/SOURCES/${package_name}-${version}.tar.gz" -C "$package_root" .
          rpm_version="${version%%-*}"
          rpm_release="1"
          if [[ "$version" == *-* ]]; then
            rpm_release="0.${version#*-}"
          fi
          cat > rpmbuild/SPECS/pseudocode.spec <<EOF
          Name: $package_name
          Version: $rpm_version
          Release: $rpm_release%{?dist}
          Summary: $display_name editor educativo de pseudocodigo
          License: MIT
          BuildArch: x86_64

          %description
          Editor de pseudocodigo en espanol hecho con .NET y Avalonia.

          %prep

          %build

          %install
          mkdir -p %{buildroot}
          tar -xzf %{_sourcedir}/${package_name}-${version}.tar.gz -C %{buildroot}

          %files
          /opt/pseudocode
          /usr/bin/pseudocode
          /usr/share/applications/pseudocode.desktop
          EOF
          rpmbuild --define "_topdir $PWD/rpmbuild" -bb rpmbuild/SPECS/pseudocode.spec
          cp rpmbuild/RPMS/x86_64/*.rpm "dist/${package_name}-${version}.x86_64.rpm"

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish/${{ matrix.output }}/*" -DestinationPath "dist/${{ matrix.output }}-${{ steps.version.outputs.tag }}.zip" -Force

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get tag
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create git tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find dist -type f | sort)

          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PseudoCode $TAG" \
            --generate-notes
